# Cada execucao sobe um banco em memoria, criado do zero pelas migracoes do Flyway -
# os testes tambem provam que o schema versionado basta para a aplicacao funcionar.
spring:
  datasource:
    url: jdbc:h2:mem:rastros-teste;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    properties:
      hibernate:
        # Para o teste de desempenho contar as consultas SQL de cada tela.
        generate_statistics: true

rastros:
  # Os testes montam os proprios dados: sem a demonstracao completa.
  demo-completa: false
  jwt:
    secret: chave-de-teste-com-mais-de-trinta-e-dois-bytes-2026
  backup:
    pasta: target/backups-teste
    manter: 3
    # "-" desliga o agendamento: um teste rodando as 12:30 nao dispara backup.
    cron: "-"
