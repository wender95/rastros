server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: rastros-api
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/rastros;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
  # O schema e versionado em src/main/resources/db/migration. Num banco anterior ao
  # Flyway, a versao 1 vira linha de base e so as migracoes seguintes rodam.
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
  jpa:
    hibernate:
      # Quem cria e altera tabela e o Flyway. O Hibernate so le e grava.
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        # Associacoes carregadas em lote (ate 100 por consulta), nao uma a uma: a semana
        # da agenda tem dezenas de carros apontando para as mesmas colunas e OS.
        default_batch_fetch_size: 100
  h2:
    console:
      # Fechado por padrao: o console da acesso direto ao banco, sem login do sistema.
      enabled: ${H2_CONSOLE:false}
      path: /h2-console
  jackson:
    serialization:
      write-dates-as-timestamps: false

rastros:
  # Dados ficticios (OS de exemplo e usuarios de demonstracao) num banco vazio. Em
  # producao fica desligado: so perfis, setores, matriz e um administrador.
  carga-demo: ${CARGA_DEMO:true}
  # Na demonstracao, gera tambem a operacao completa: equipe da Frota, agenda com um projeto
  # por dia por adesivador (inicio e conclusao registrados) e OS passando pelos setores.
  demo-completa: ${DEMO_COMPLETA:true}
  # A empresa que usa esta instalacao do RastrOS (nome e logo branca, em static/ ou uma URL).
  empresa:
    nome: ${EMPRESA_NOME:RastrOS}
    logo: ${EMPRESA_LOGO:/rastros-logo-branca.svg}
  # O administrador "agindo como" outra pessoa e so para a fase de teste de uma instalacao:
  # desligado. Liga com PERSONIFICACAO=true.
  personificacao:
    habilitada: ${PERSONIFICACAO:false}
  jwt:
    # Vazio: a instalacao gera a propria chave em data/jwt.secret na primeira partida.
    secret: ${JWT_SECRET:}
    arquivo-segredo: ${JWT_ARQUIVO:./data/jwt.secret}
    expiracao-horas: ${JWT_EXP_HORAS:12}
  backup:
    pasta: ${BACKUP_PASTA:./backups}
    manter: ${BACKUP_MANTER:30}
    # Todo dia util as 12:30 (segundo minuto hora dia mes dia-da-semana).
    cron: ${BACKUP_CRON:0 30 12 * * MON-FRI}
  cors:
    # A extensao do navegador entra como chrome-extension://<id>, e o id muda de maquina
    # para maquina; o que barra de verdade continua sendo o login, nao a origem.
    origens: ${CORS_ORIGENS:http://localhost:5173,http://127.0.0.1:5173,chrome-extension://*,moz-extension://*}

logging:
  level:
    root: INFO
    com.rastros: INFO

# Previsao do tempo do painel (Open-Meteo, sem chave). A cidade da empresa; troque pelas
# variaveis CLIMA_CIDADE, CLIMA_LATITUDE e CLIMA_LONGITUDE se nao for Sao Paulo.
clima:
  cidade: ${CLIMA_CIDADE:Sao Paulo}
  latitude: ${CLIMA_LATITUDE:-23.5505}
  longitude: ${CLIMA_LONGITUDE:-46.6333}
